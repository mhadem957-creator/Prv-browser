name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # This repo doesn't commit the android/ platform folder (it contains a
      # binary Gradle wrapper jar) — generate it fresh against whatever
      # Flutter SDK version this workflow installed.
      - name: Scaffold Android platform folder
        run: flutter create --platforms=android --org com.privacybrowser --project-name privacy_browser .

      # Inlined here (not a separate scripts/*.py file) so the workflow has
      # no dependency on any other file existing in the repo.
      - name: Patch AndroidManifest.xml (permissions, app label)
        run: |
          python3 - << 'PYEOF'
          import re
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest_path.exists():
              raise SystemExit(f"ERROR: {manifest_path} not found.")

          text = manifest_path.read_text(encoding="utf-8")

          required_permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
          ]

          manifest_open = re.search(r"<manifest[^>]*>", text)
          if manifest_open:
              insert_at = manifest_open.end()
              missing = [p for p in required_permissions if p.split('"')[1] not in text]
              if missing:
                  block = "\n    " + "\n    ".join(missing)
                  text = text[:insert_at] + block + text[insert_at:]

          if 'android:label="' in text:
              text = re.sub(
                  r'android:label="[^"]*"',
                  'android:label="Privacy Browser"',
                  text,
                  count=1,
              )

          if "android:usesCleartextTraffic" not in text:
              text = re.sub(
                  r"(<application\b)",
                  r'\1\n        android:usesCleartextTraffic="false"',
                  text,
                  count=1,
              )

          manifest_path.write_text(text, encoding="utf-8")
          print(f"Patched {manifest_path}")
          PYEOF

          - name: Remove default widget test
        run: rm -f test/widget_test.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis (non-blocking)
        run: flutter analyze || true

      - name: Run unit tests
        run: flutter test

      - name: Build release APK (per-ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
