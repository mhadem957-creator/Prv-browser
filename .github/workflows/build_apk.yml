name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # This repo doesn't commit the android/ platform folder (it contains a
      # binary Gradle wrapper jar) — generate it fresh against whatever
      # Flutter SDK version this workflow installed, then patch it.
      - name: Scaffold Android platform folder
        run: flutter create --platforms=android --org com.privacybrowser --project-name privacy_browser .

      - name: Patch AndroidManifest.xml (permissions, app label)
        run: python3 scripts/patch_manifest.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis (non-blocking)
        run: flutter analyze || true

      - name: Run unit tests
        run: flutter test

      - name: Build release APK (per-ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
